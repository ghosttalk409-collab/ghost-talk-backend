name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Needed by the last step, which commits the freshly built APK to public/GhostTalk.apk
# so the "Download Android APK" button always serves a build that contains every fix.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/android
          # Alerts are generated by the app itself, so no Firebase file and no secret are needed.
          # The plugin version must match the Capacitor CLI that was just installed.
          CAP_MAJOR="$(node -p "require('@capacitor/cli/package.json').version.split('.')[0]")"
          echo "Capacitor major version: $CAP_MAJOR"
          npm install "@capacitor/local-notifications@${CAP_MAJOR}"

      - name: Ensure Web Assets Directory Exists
        run: |
          mkdir -p www
          mkdir -p public
          if [ -d "public" ] && [ "$(ls -A public)" ]; then
            cp -r public/* www/ || true
          fi
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>Ghost Talk</title></head><body><div id="root"></div></body></html>' > www/index.html
          fi

      - name: Build Web Assets (if build script exists)
        run: |
          if npm run | grep -q "build"; then
            npm run build || true
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify notification plugin is really linked
        run: |
          cat android/app/capacitor.build.gradle
          if ! grep -q "capacitor-local-notifications" android/app/capacitor.build.gradle; then
            echo "::error::@capacitor/local-notifications was not linked into the Android project. Alerts would be dead in this APK, so the build is stopped."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties & compatibility flags
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --info --continue --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostTalk-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Without this step the download button kept serving an old APK while the fixed build
      # only existed as a build artifact, so phones kept running the version without alerts.
      - name: Publish this APK to the download page
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          cp "$SRC" public/GhostTalk.apk
          ls -l public/GhostTalk.apk
          git config user.name "ghost-talk-build"
          git config user.email "ghosttalk409@gmail.com"
          git add public/GhostTalk.apk
          if git diff --cached --quiet; then
            echo "Download page already has this APK"
            exit 0
          fi
          git commit -m "build: publish the newest APK to the download page"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
