name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/android

      - name: Ensure Web Assets Directory Exists
        run: |
          mkdir -p www
          mkdir -p public
          if [ -d "public" ] && [ "$(ls -A public)" ]; then
            cp -r public/* www/ || true
          fi
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>Ghost Talk</title></head><body><div id="root"></div></body></html>' > www/index.html
          fi

      - name: Build Web Assets (если build script exists)
        run: |
          if npm run | grep -q "build"; then
            npm run build || true
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties and fix Proguard property
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostTalk-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
