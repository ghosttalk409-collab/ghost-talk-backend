name: Apply TURN update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Splice code in and check
        run: |
          cat > /tmp/apply.js <<'JS'
          const fs = require('fs');
          let s = fs.readFileSync('server.js', 'utf8');
          if (s.includes('turnServersFromApi')) { console.log('already applied'); process.exit(0); }
          const block = fs.readFileSync('turn-block.txt', 'utf8').replace(/\s+$/, '');
          const routeStart = s.indexOf("app.get('/api/ice-servers'");
          if (routeStart < 0) throw new Error('route anchor missing');
          const mi = s.indexOf("relayOnly ? 'relay' : 'all' });", routeStart);
          if (mi < 0) throw new Error('body anchor missing');
          const end = s.indexOf('\n});', mi) + 4;
          s = s.slice(0, routeStart) + block + s.slice(end);
          fs.writeFileSync('server.js', s);
          console.log('patched bytes', s.length);
          JS
          node /tmp/apply.js
          node --check server.js
          grep -c turnServersFromApi server.js

      - name: Commit and clean up
        run: |
          git config user.name "ghost-talk-sync"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "calls: accept provider TURN credentials so peers can stay behind a relay"
          rm -f turn-block.txt .github/workflows/apply-turn.yml
          git add -A
          git commit -m "chore: remove one-time update files"
          git push origin main
