name: Apply Ghost Talk 107 files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the fixed files
        run: |
          set -euo pipefail
          B="https://ghost-talk-107-files-yicbuo-preview.freebuff.site"
          mkdir -p public .github/workflows
          mkdir -p android/app/src/main/java/com/ghosttalk/app
          curl -fsSL "$B/server.js"              -o server.js
          curl -fsSL "$B/app.js"                 -o public/app.js
          curl -fsSL "$B/security.js"            -o public/security.js
          curl -fsSL "$B/security.css"           -o public/security.css
          curl -fsSL "$B/AndroidManifest.xml"    -o android/app/src/main/AndroidManifest.xml
          curl -fsSL "$B/MainActivity.java"      -o android/app/src/main/java/com/ghosttalk/app/MainActivity.java
          curl -fsSL "$B/GhostAlertService.java" -o android/app/src/main/java/com/ghosttalk/app/GhostAlertService.java
          curl -fsSL "$B/GhostAlertsPlugin.java" -o android/app/src/main/java/com/ghosttalk/app/GhostAlertsPlugin.java
          curl -fsSL "$B/build.yml"              -o .github/workflows/build.yml
          node --check server.js
          node --check public/app.js
          echo "downloaded and syntax-checked"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ghost-talk-sync"
          git config user.email "ghosttalk409@gmail.com"
          rm -f .github/workflows/apply-fix-107.yml
          git add -A
          git commit -m "version 107: hardened security, notification fix, group calls for premium"
          git push
