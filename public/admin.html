<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Talk - Secure Admin Panel</title>
  <style>
    :root { --bg-dark: #0e1110; --card-bg: #141817; --border-color: #232d2a; --accent-gold: #c5a059; --accent-red: #d95764; --text-main: #e2e8f0; --text-muted: #8892b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 16px; font-size: 13px; }
    .status-badge { padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 10px; background: #1a2220; color: var(--accent-gold); border: 1px solid var(--accent-gold); }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .btn { background: #1a2220; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: var(--accent-gold); color: #000; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h2>🛡️ GHOST TALK COMMAND DASHBOARD</h2>
    <div id="connectionStatus" class="status-badge">CONNECTING...</div>
  </div>

  <div class="card">
    <h3>Master Key Verification Required</h3>
    <p style="color: var(--text-muted); margin-top: 8px;">Enter your MASTER_KEY to interact with backend telemetry.</p>
    <input type="password" id="masterKeyInput" placeholder="Master Key" style="background:#0b0e0d; border:1px solid #232d2a; color:#fff; padding:8px; border-radius:4px; margin-top:10px;">
    <button class="btn" onclick="authenticateAdmin()">Authenticate Session</button>
  </div>

  <script>
    let ws = null;
    let masterKey = '';
    const statusEl = document.getElementById('connectionStatus');

    function authenticateAdmin() {
      masterKey = document.getElementById('masterKeyInput').value.trim();
      if (!masterKey) return alert('Enter master key.');
      const secret = prompt('Enter Admin Passphrase:');
      if (!secret) return;

      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + window.location.host);
      statusEl.innerText = 'AUTHENTICATING...';
      
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'admin-auth', secret }));
      };

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'admin-authenticated') {
          statusEl.innerText = 'SECURED & AUTHORIZED';
          alert('Authenticated successfully.');
        } else if (msg.type === 'admin-error') {
          statusEl.innerText = 'UNAUTHORIZED';
          alert(msg.message || 'Authentication failed.');
        }
      };

      ws.onclose = () => {
        statusEl.innerText = 'OFFLINE';
      };
    }
  </script>
</body>
</html>
