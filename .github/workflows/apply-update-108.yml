name: Apply update 108

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the prepared files
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/update.tgz "https://litter.catbox.moe/st3o0r.tgz"
          echo "ca5958274270c107869378e85e02d7159aa39b2190c65805e0ce86fa681355f6  /tmp/update.tgz" | sha256sum -c -
          tar -xzf /tmp/update.tgz -C .
          rm -f /tmp/update.tgz
          grep -q "ensureAlertsReady" public/app.js
          grep -q "REQ_POST_NOTIFICATIONS" android/app/src/main/java/com/ghosttalk/app/MainActivity.java
          grep -q "Permissions-Policy" server.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ghost-talk-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A public server.js android
          git commit -m "fix(alerts): ask Android for notification permission at launch; security hardening"
          git push origin HEAD:main
